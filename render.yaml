databases:
  - name: nutrilens-db
    databaseName: nutrilens
    user: nutrilens_user
    plan: free

services:
  # 1. Backend REST API Service
  - type: web
    name: nutrilens-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nutrilens-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: nutrilens-frontend
          property: host

  # 2. Frontend Static Site
  - type: web
    name: nutrilens-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: nutrilens-backend
          property: host
